name: CI/CD Mono

# Este workflow é do repo raiz (mono). Cada submódulo (infra, lambda,
# os-service, inventory-service, billing-service) tem seu PRÓPRIO
# CI/CD, no repo dele — este workflow NÃO duplica essa lógica: os jobs
# "deploy-*" chamam o workflow reusável de cada repo
# (uses: OWNER/REPO/.github/workflows/arquivo.yml@master), na ordem certa.
#
# PRÉ-REQUISITO: cada repo submódulo precisa permitir ser chamado de fora em
# Settings > Actions > General > Access ("Accessible from repositories in the
# 'lataVelha' organization" ou liberar este repo explicitamente).
#
# Ordem de deploy:
#   infra bootstrap → (infra addons ‖ infra messaging) →
#     os-service ‖ inventory-service ‖ billing-service →
#     lambda (lê o RDS do os-service) → edge (rotas do API Gateway)
#
# Paralelismo:
#   1. addons ‖ messaging — states S3 independentes, os dois só
#      precisam do bootstrap (VPC/subnets/EKS).
#   2. os ‖ inventory ‖ billing — cada workload depende só do state do
#      messaging. Nenhum depende do edge.
#   3. lambda depois do os-service (lê o RDS dele) e do addons (API Gateway).
#   4. edge depois do lambda, porque lê o state do lambda (authorizer).
#
# Ordem de destroy (workflow_dispatch com destroy=true): a inversa,
# começando pelo edge.

on:
  push:
    branches: [master]
    paths:
      - "infra"
      - "infra/**"
      - "lambda"
      - "lambda/**"
      - "os-service"
      - "os-service/**"
      - "inventory-service"
      - "inventory-service/**"
      - "billing-service"
      - "billing-service/**"
      - "scripts/**"
      - "apply.sh"
      - ".github/workflows/main.yml"
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      destroy:
        description: "Destruir toda a topologia na ordem inversa"
        type: boolean
        default: false
      dry_run:
        description: "Rodar apenas a validação (sem deploy, apply ou destroy)"
        type: boolean
        default: false

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

# Um deploy do mono por vez; nunca cancela o que está em andamento.
# Exceção: PR — ali não existe deploy (os jobs de CD são skipped), então
# cancelar um run antigo do mesmo PR só economiza runner/tempo.
concurrency:
  group: mono-deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================
  # CI · VALIDAÇÃO (matrizes independentes)
  # ============================================================
  validate-terraform:
    name: "CI · Terraform validate (${{ matrix.name }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: infra bootstrap + addons
            dirs: "infra/terraform/bootstrap infra/terraform/addons"
            fmt: false
          - name: infra messaging
            dirs: "infra/terraform/messaging"
            fmt: true
          - name: infra edge
            dirs: "infra/terraform/edge"
            fmt: true
          - name: lambda
            dirs: "lambda/terraform/deploy"
            fmt: false
          - name: os-service
            dirs: "os-service/terraform"
            fmt: true
          - name: inventory-service
            dirs: "inventory-service/terraform"
            fmt: true
          - name: billing-service
            dirs: "billing-service/terraform"
            fmt: true
          - name: infra observability (Datadog)
            dirs: "infra/terraform/observability"
            fmt: true

    steps:
      - name: Checkout do código (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Instalar Terraform 1.10
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.x"

      - name: Terraform validate — ${{ matrix.name }}
        env:
          FMT: ${{ matrix.fmt }}
        run: |
          set -euo pipefail
          for dir in ${{ matrix.dirs }}; do
            echo "::group::$dir"
            if [ "$FMT" = "true" ]; then
              terraform -chdir="$dir" fmt -check -recursive
            fi
            terraform -chdir="$dir" init -backend=false
            terraform -chdir="$dir" validate
            echo "::endgroup::"
          done

  validate-java:
    name: "CI · Testes Maven (${{ matrix.service }})"
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        service: [os-service, inventory-service, billing-service]

    steps:
      - name: Checkout do código (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Java 21 (Corretto)
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: corretto
          cache: maven
          cache-dependency-path: ${{ matrix.service }}/pom.xml

      - name: Testes automatizados — ${{ matrix.service }} (Maven)
        working-directory: ${{ matrix.service }}
        run: mvn -B test -Dspring.profiles.active=test

  validate-lambda:
    name: "CI · Testes lambda (pytest)"
    runs-on: ubuntu-24.04
    timeout-minutes: 10

    steps:
      - name: Checkout do código (com submódulos)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lambda/requirements/dev.txt

      - name: Testes automatizados — lambda (pytest)
        working-directory: lambda
        run: |
          pip install -r requirements/dev.txt
          pytest -q

  validate:
    name: "CI · Validação dos submódulos"
    needs: [validate-terraform, validate-java, validate-lambda]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5

    steps:
      - name: Consolidar resultado das matrizes
        run: |
          TF="${{ needs.validate-terraform.result }}"
          MAVEN="${{ needs.validate-java.result }}"
          PYTEST="${{ needs.validate-lambda.result }}"

          {
            echo "### CI · Validação"
            echo ""
            echo "| matriz | resultado |"
            echo "|---|---|"
            echo "| terraform validate | \`$TF\` |"
            echo "| testes Maven | \`$MAVEN\` |"
            echo "| pytest lambda | \`$PYTEST\` |"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$TF" != "success" ] || [ "$MAVEN" != "success" ] || [ "$PYTEST" != "success" ]; then
            echo "::error::Validação falhou (terraform=$TF maven=$MAVEN pytest=$PYTEST) — veja os jobs de matriz acima."
            exit 1
          fi

  # ============================================================
  # CD · DEPLOY — ordem de dependência completa.
  # ============================================================
  deploy-infra-bootstrap:
    name: "CD · infra (bootstrap)"
    needs: validate
    if: >
      github.event.inputs.dry_run != 'true' &&
      ((github.event_name == 'workflow_dispatch' && github.event.inputs.destroy != 'true') ||
       (github.event_name == 'push' && github.ref == 'refs/heads/master'))
    uses: lataVelha/lata-velha-pos-tech-fiap-infra/.github/workflows/bootstrap.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-infra-addons:
    name: "CD · infra (addons)"
    needs: deploy-infra-bootstrap
    uses: lataVelha/lata-velha-pos-tech-fiap-infra/.github/workflows/addons.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      # O monolito foi removido: paths nao roteados viram 404 (catch-all).
      app_enabled: false
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_VAR_dd_api_key: ${{ secrets.TF_VAR_DD_API_KEY }}

  deploy-infra-messaging:
    name: "CD · infra (messaging SNS/SQS)"
    needs: deploy-infra-bootstrap
    uses: lataVelha/lata-velha-pos-tech-fiap-infra/.github/workflows/messaging.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: false
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  deploy-lambda:
    name: "CD · lambda"
    # A lambda auth-cpf le o RDS do os-service; por isso depende do deploy
    # do os-service (e do addons, onde registra a authorizer).
    needs: [deploy-infra-addons, deploy-os-service]
    uses: lataVelha/lata-velha-pos-tech-fiap-lambda/.github/workflows/main.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  # ============================================================
  # CD · WORKLOADS — os, inventory e billing rodam EM PARALELO.
  # Cada um depende só dos states que realmente lê:
  #   os/inventory/billing → messaging
  # A lambda (job acima) depende do os-service: a auth-cpf le o RDS dele.
  # ============================================================
  deploy-os-service:
    name: "CD · os-service"
    needs: [deploy-infra-messaging]
    uses: lataVelha/lata-velha-pos-tech-fiap-os-service/.github/workflows/main.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: false
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_MAIL_USERNAME: ${{ secrets.TF_MAIL_USERNAME }}
      TF_MAIL_PASSWORD: ${{ secrets.TF_MAIL_PASSWORD }}
      TF_DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}

  deploy-inventory-service:
    name: "CD · inventory-service"
    needs: deploy-infra-messaging
    uses: lataVelha/lata-velha-pos-tech-fiap-inventory-service/.github/workflows/main.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: false
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_MAIL_USERNAME: ${{ secrets.TF_MAIL_USERNAME }}
      TF_MAIL_PASSWORD: ${{ secrets.TF_MAIL_PASSWORD }}
      TF_DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}

  deploy-billing-service:
    name: "CD · billing-service"
    needs: deploy-infra-messaging
    uses: lataVelha/lata-velha-pos-tech-fiap-billing-service/.github/workflows/main.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: false
      dry_run: ${{ github.event.inputs.dry_run == 'true' }}
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.TF_MERCADOPAGO_ACCESS_TOKEN }}
      TF_MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.TF_MERCADOPAGO_WEBHOOK_SECRET }}
      TF_DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}

  # ============================================================
  # CD · EDGE — dono único da integração/rotas do API Gateway.
  # ============================================================
  deploy-edge:
    name: "CD · edge (rotas do API Gateway)"
    needs: deploy-lambda
    if: >
      always() &&
      github.event.inputs.dry_run != 'true' &&
      needs.deploy-lambda.result == 'success'
    uses: lataVelha/lata-velha-pos-tech-fiap-infra/.github/workflows/edge.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: false
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  # ============================================================
  # CD · DESTROY — ordem inversa da topologia, começando pelo edge.
  # Só roda via workflow_dispatch manual com destroy=true.
  # ============================================================
  destroy-edge:
    name: "CD · Destruir · edge (rotas do API Gateway)"
    needs: validate
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
    uses: lataVelha/lata-velha-pos-tech-fiap-infra/.github/workflows/edge.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  destroy-billing-service:
    name: "CD · Destruir · billing-service"
    needs: destroy-edge
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.destroy == 'true'
    uses: lataVelha/lata-velha-pos-tech-fiap-billing-service/.github/workflows/main.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_MERCADOPAGO_ACCESS_TOKEN: ${{ secrets.TF_MERCADOPAGO_ACCESS_TOKEN }}
      TF_MERCADOPAGO_WEBHOOK_SECRET: ${{ secrets.TF_MERCADOPAGO_WEBHOOK_SECRET }}
      TF_DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}

  destroy-inventory-service:
    name: "CD · Destruir · inventory-service"
    needs: destroy-billing-service
    uses: lataVelha/lata-velha-pos-tech-fiap-inventory-service/.github/workflows/main.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_MAIL_USERNAME: ${{ secrets.TF_MAIL_USERNAME }}
      TF_MAIL_PASSWORD: ${{ secrets.TF_MAIL_PASSWORD }}
      TF_DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}

  destroy-os-service:
    name: "CD · Destruir · os-service"
    # A lambda le o state do os-service; ela precisa ser destruida antes.
    needs: destroy-lambda
    uses: lataVelha/lata-velha-pos-tech-fiap-os-service/.github/workflows/main.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
      TF_MAIL_USERNAME: ${{ secrets.TF_MAIL_USERNAME }}
      TF_MAIL_PASSWORD: ${{ secrets.TF_MAIL_PASSWORD }}
      TF_DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}

  destroy-lambda:
    name: "CD · Destruir · lambda"
    needs: destroy-inventory-service
    uses: lataVelha/lata-velha-pos-tech-fiap-lambda/.github/workflows/main.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  destroy-infra-messaging:
    name: "CD · Destruir · infra (messaging)"
    # O os-service le o state do messaging; ele precisa ser destruido antes.
    needs: destroy-os-service
    uses: lataVelha/lata-velha-pos-tech-fiap-infra/.github/workflows/messaging.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  destroy-infra-addons:
    name: "CD · Destruir · infra (addons)"
    needs: destroy-infra-messaging
    uses: lataVelha/lata-velha-pos-tech-fiap-infra/.github/workflows/addons.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  destroy-infra-bootstrap:
    name: "CD · Destruir · infra (bootstrap)"
    needs: destroy-infra-addons
    uses: lataVelha/lata-velha-pos-tech-fiap-infra/.github/workflows/bootstrap.yml@master
    with:
      aws_region: ${{ vars.AWS_REGION || 'us-east-1' }}
      destroy: true
    secrets:
      AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
      AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}

  # ============================================================
  # EVIDÊNCIAS — sumário auditável do run.
  # ============================================================
  summary:
    name: "CD · Sumário do run"
    needs:
      - validate
      - deploy-os-service
      - deploy-inventory-service
      - deploy-billing-service
      - deploy-lambda
      - deploy-edge
      - destroy-edge
      - destroy-lambda
      - destroy-infra-bootstrap
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Publicar sumário
        run: |
          {
            echo "## Lata Velha — execução do mono"
            echo ""
            echo "| campo | valor |"
            echo "|---|---|"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| evento | \`${{ github.event_name }}\` |"
            echo "| ref | \`${{ github.ref }}\` |"
            echo "| destroy | \`${{ github.event.inputs.destroy || 'false' }}\` |"
            echo "| dry_run | \`${{ github.event.inputs.dry_run || 'false' }}\` |"
            echo ""
            echo "### Jobs"
            echo ""
            echo "| job | resultado |"
            echo "|---|---|"
            echo "| validate | \`${{ needs.validate.result }}\` |"
            echo "| deploy-os-service | \`${{ needs.deploy-os-service.result }}\` |"
            echo "| deploy-inventory-service | \`${{ needs.deploy-inventory-service.result }}\` |"
            echo "| deploy-billing-service | \`${{ needs.deploy-billing-service.result }}\` |"
            echo "| deploy-lambda | \`${{ needs.deploy-lambda.result }}\` |"
            echo "| deploy-edge | \`${{ needs.deploy-edge.result }}\` |"
            echo "| destroy-edge | \`${{ needs.destroy-edge.result }}\` |"
            echo "| destroy-lambda | \`${{ needs.destroy-lambda.result }}\` |"
            echo "| destroy-infra-bootstrap | \`${{ needs.destroy-infra-bootstrap.result }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
