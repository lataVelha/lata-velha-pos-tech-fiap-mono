name: Verify Observability (Datadog)

# Verificação somente-leitura do Datadog, sem deploy. Útil para provar que
# as métricas/logs/spans continuam chegando depois de um teste de fluxo.
#
# Uso:
#   gh workflow run verify-observability.yml --ref <branch> \
#     -f window=30m -f wait=30
#
# As chaves vêm dos mesmos secrets do pipeline principal
# (TF_VAR_DD_API_KEY / TF_VAR_DD_APP_KEY) e nunca são impressas.

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Janela de consulta (ex.: 30m, 2h)"
        type: string
        default: "30m"
      wait:
        description: "Segundos de espera antes da primeira consulta"
        type: string
        default: "30"
      synthetic_wait:
        description: "Segundos de espera para o primeiro resultado dos synthetics"
        type: string
        default: "360"
      api_url:
        description: "URL pública do health (opcional; vazio = descobre no state S3)"
        type: string
        default: ""
  # Enquanto o workflow não está na default branch, o workflow_dispatch
  # retorna 404. O gatilho abaixo permite validá-lo na feature branch sem
  # rodar a cada push (só quando o próprio workflow/script muda).
  push:
    branches: [feature/observability]
    paths:
      - ".github/workflows/verify-observability.yml"
      - "scripts/verify_datadog.py"

permissions:
  contents: read

jobs:
  verify:
    name: "Observability · Datadog (dados reais)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Autenticar na AWS
        if: inputs.api_url == ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Descobrir URL pública do health
        if: inputs.api_url == ''
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="lata-velha-tfstate-${ACCOUNT_ID}"
          aws s3 cp "s3://${STATE_BUCKET}/lata-velha/infra-addons/terraform.tfstate" /tmp/addons.tfstate > /dev/null
          APP_URL=$(jq -r '.outputs.app_api_endpoint.value' /tmp/addons.tfstate)
          echo "APP_API_URL=${APP_URL}" >> "$GITHUB_ENV"
          echo "API: ${APP_URL}"

      - name: Usar URL informada
        if: inputs.api_url != ''
        run: |
          echo "APP_API_URL=${{ inputs.api_url }}" >> "$GITHUB_ENV"
          echo "API: ${{ inputs.api_url }}"

      - name: Gerar tráfego de verificação (EKS + Lambda)
        if: env.APP_API_URL != ''
        continue-on-error: true
        run: |
          set -euo pipefail
          BASE="${APP_API_URL%/}"
          TOKEN=$(curl -sf -X POST "$BASE/auth/cpf" \
            -H 'Content-Type: application/json' \
            -d '{"cpf":"111.444.777-35","password":"Admin@123"}' | jq -r '.token')
          curl -s -o /dev/null "$BASE/ordens-servico?page=0&size=5" -H "Authorization: Bearer $TOKEN"
          curl -s -o /dev/null "$BASE/ordens-servico?id=1" -H "Authorization: Bearer $TOKEN"
          curl -s -o /dev/null "$BASE/proprietarios?page=0&size=5" -H "Authorization: Bearer $TOKEN"
          curl -s -o /dev/null "$BASE/pecas?page=0&size=5" -H "Authorization: Bearer $TOKEN"
          curl -s -o /dev/null "$BASE/billing/v3/api-docs"
          curl -s -o /dev/null "$BASE/pagamentos/ordem-servico/1" -H "Authorization: Bearer $TOKEN"
          curl -s -o /dev/null "$BASE/ordens-servico"

      - name: Forçar alarme CloudWatch (validação 20.3)
        if: inputs.api_url == ''
        run: |
          set -euo pipefail
          ALARM=$(aws cloudwatch describe-alarms \
            --query "MetricAlarms[?contains(AlarmName, 'lata-velha')].AlarmName | [0]" \
            --output text)
          if [ -z "$ALARM" ] || [ "$ALARM" = "None" ]; then
            echo "Nenhum alarme lata-velha encontrado; DT-DD-18 será skip"
            echo "DD_TEST_ALARM_NAME=" >> "$GITHUB_ENV"
            exit 0
          fi
          echo "DD_TEST_ALARM_NAME=${ALARM}" >> "$GITHUB_ENV"
          echo "Forçando ALARM em ${ALARM} para validar EventBridge -> Datadog Events"
          if ! aws cloudwatch set-alarm-state --alarm-name "$ALARM" \
              --state-value ALARM \
              --state-reason "lata-velha 20.3 validation $(date -u +%s)"; then
            echo "::warning::Não foi possível forçar o alarme (permissão AWS Academy); DT-DD-18 será skip"
            echo "DD_TEST_ALARM_NAME=" >> "$GITHUB_ENV"
            exit 0
          fi
          sleep 25
          FAILED=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Events \
            --metric-name FailedInvocations \
            --dimensions Name=RuleName,Value=lata-velha-cloudwatch-alarms-forwarder \
            --start-time "$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --period 60 --statistics Sum \
            --query 'Datapoints[].Sum' --output text 2>/dev/null || true)
          echo "EventBridge FailedInvocations=${FAILED:-0}"
          INVOKED=$(aws cloudwatch get-metric-statistics \
            --namespace AWS/Events \
            --metric-name Invocations \
            --dimensions Name=RuleName,Value=lata-velha-cloudwatch-alarms-forwarder \
            --start-time "$(date -u -d '10 minutes ago' +%Y-%m-%dT%H:%M:%SZ)" \
            --end-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --period 60 --statistics Sum \
            --query 'Datapoints[].Sum' --output text 2>/dev/null || true)
          echo "EventBridge Invocations=${INVOKED:-0}"
          aws cloudwatch set-alarm-state --alarm-name "$ALARM" \
            --state-value OK \
            --state-reason "lata-velha 20.3 restore" || true

      - name: Verificar Datadog e health
        env:
          DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.TF_VAR_DD_APP_KEY }}
          WINDOW: ${{ inputs.window || '30m' }}
          WAIT_SECONDS: ${{ inputs.wait || '30' }}
          SYNTHETIC_WAIT: ${{ inputs.synthetic_wait || '0' }}
        run: |
          python3 scripts/verify_datadog.py \
            --env prod \
            --window "${WINDOW}" \
            --api-url "$APP_API_URL" \
            --wait "${WAIT_SECONDS}" \
            --cloudwatch-event "${DD_TEST_ALARM_NAME:-}" \
            --synthetic-wait "${SYNTHETIC_WAIT}" \
            --report datadog-report.json

      - name: Diagnóstico — spans recentes (continuidade SQS)
        if: always()
        env:
          DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.TF_VAR_DD_APP_KEY }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import sys
          from datetime import timedelta

          sys.path.insert(0, "scripts")
          import verify_datadog as v

          client = v.DatadogClient(os.environ["DD_API_KEY"], os.environ["DD_APP_KEY"])
          end = v.utc_now()
          start = end - timedelta(minutes=30)
          for service in (
              "lata-velha-os-service",
              "lata-velha-inventory-service",
              "lata-velha-billing-service",
          ):
              payload = client.search_spans(f"service:{service} env:prod", start, end, limit=5)
              print(f"== {service} ==")
              print(json.dumps(payload, indent=2)[:15000])
          PY

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datadog-report
          path: datadog-report.json
          if-no-files-found: warn
