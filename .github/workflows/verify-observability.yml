name: Verify Observability (Datadog)

# Verificação somente-leitura do Datadog, sem deploy. Útil para provar que
# as métricas/logs/spans continuam chegando depois de um teste de fluxo.
#
# Uso:
#   gh workflow run verify-observability.yml --ref <branch> \
#     -f window=30m -f wait=30
#
# As chaves vêm dos mesmos secrets do pipeline principal
# (TF_VAR_DD_API_KEY / TF_VAR_DD_APP_KEY) e nunca são impressas.

on:
  workflow_dispatch:
    inputs:
      window:
        description: "Janela de consulta (ex.: 30m, 2h)"
        type: string
        default: "30m"
      wait:
        description: "Segundos de espera antes da primeira consulta"
        type: string
        default: "30"
  # Enquanto o workflow não está na default branch, o workflow_dispatch
  # retorna 404. O gatilho abaixo permite validá-lo na feature branch sem
  # rodar a cada push (só quando o próprio workflow/script muda).
  push:
    branches: [feature/observability]
    paths:
      - ".github/workflows/verify-observability.yml"
      - "scripts/verify_datadog.py"

permissions:
  contents: read

jobs:
  verify:
    name: "Observability · Datadog (dados reais)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    steps:
      - name: Checkout do código
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Autenticar na AWS
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ vars.AWS_REGION || 'us-east-1' }}

      - name: Descobrir URL pública do health
        run: |
          ACCOUNT_ID=$(aws sts get-caller-identity --query Account --output text)
          STATE_BUCKET="lata-velha-tfstate-${ACCOUNT_ID}"
          aws s3 cp "s3://${STATE_BUCKET}/lata-velha/infra-addons/terraform.tfstate" /tmp/addons.tfstate > /dev/null
          APP_URL=$(jq -r '.outputs.app_api_endpoint.value' /tmp/addons.tfstate)
          echo "APP_API_URL=${APP_URL}" >> "$GITHUB_ENV"
          echo "API: ${APP_URL}"

      - name: Verificar Datadog e health
        env:
          DD_API_KEY: ${{ secrets.TF_VAR_DD_API_KEY }}
          DD_APP_KEY: ${{ secrets.TF_VAR_DD_APP_KEY }}
        run: |
          python3 scripts/verify_datadog.py \
            --env prod \
            --window "${{ inputs.window }}" \
            --api-url "$APP_API_URL" \
            --wait "${{ inputs.wait }}" \
            --report datadog-report.json

      - name: Publicar relatório
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: datadog-report
          path: datadog-report.json
          if-no-files-found: warn
